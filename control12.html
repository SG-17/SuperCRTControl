<!--
*********************
	!!BASIC INSTALL!!
	
	To set a command link enter the IP Address of your Extron Matrix Switcher (Crosspoint, DXP, MVX) that you use to access the web control menu followed by "?cmd=#." 
	Replace the # with the number of the profile on the Extron that the link will be loading. The period (.) at the end is necessary, do not delete it.
	Change the image link to the matching image you desire and the alt text to match.
	Example below:
				<a href="http://192.168.1.252/?cmd=1." target="iframe1"><img src="images/psx-crt-c.png" alt="PS2"></a>

	If you need a button to load a profile on more than one Extron at a time use the following format for the link:
				<a href="#" onclick="multiCmd([
								'http://192.168.1.249/?cmd=5.',
								'http://192.168.1.252/?cmd=7.'
								]); return false;">
					<img src="images/gamecube-crt-c.png" alt="NGC (both)">
				</a>
	
	To make a button that resets all ties (input & output connections) use "?cmd=0*!" in your url.
	
	To control a DXP HD 4K or DXP HD 4K Plus matrix add the following to your url:
		<a href="http://192.168.1.248/?cmd=5." data-transport="tcp" target="iframe1"><img src="images/4kpro-crt-c.png" alt="RetroTink"></a>
		
	Or for multi-urls:
		<a href="#" onclick="multiCmd([
						'http://192.168.1.252/?cmd=7.',
				{ url: 'http://192.168.1.248/?cmd=5.', transport: 'tcp' }
				]); return false;">
		<img src="images/psx-crt-c.png" alt="PlayStations">
		</a>
				
*********************
	!!ADVANCED INSTALL!!
	
	To set a command link enter the IP Address of your Super CRT install or use http://supercrt.local followed by the short code you setup in aliases.json.
	
	Change the image link to the matching image you desire and the alt text to match.
	Example below:
				<a href="http://192.168.1.251/ps1" target="iframe1"><img src="images/psx-crt-c.png" alt="PS1"></a>
			or
				<a href="http://supercrt.local/ps1" target="iframe1"><img src="images/psx-crt-c.png" alt="PS1"></a>
			or
				<a href="ps1" target="iframe1"><img src="images/psx-crt-c.png" alt="PS1"></a>	
	
	If you need a button to load more than one aliased link at a time use the following format for the link:
				<a href="#" onclick="multiCmd([
								'http://192.168.1.251/ps1',
								'http://192.168.1.251/ps2'
								]); return false;">
					<img src="images/psx-crt-c.png" alt="PlayStations">
				</a>
	Of course you can setup an alias that loads more than one profile at a time.
	
	To make a button that resets all ties (input & output connections) use /reset in your url.
				
*********************
	
	You can link to submenus or second pages for more systems or game specific profiles by simply linking to the new page.
	Example below:
				<a href="controlps2.html"><img src="images/ps2-crt-c.png" alt="PS2 Submenu"></a>
				
	Be sure that 'target="iframe1"' is not included in submenu links.
	If your main page is named "index.html" a simple "/" in the href= of a link on a submenu page will take you back to the main page.
	
	Set the style link on line 12 in the header to match the number of buttons you will use for a subpage.
	Examples below:
				<link href="css/style12.css" rel="stylesheet">
				<link href="css/style16.css" rel="stylesheet">
				<link href="css/style20.css" rel="stylesheet">
				<link href="css/style32.css" rel="stylesheet">
	
********************
	
	If you need assistance please ask SG-17 on the RetroTink Discord https://discord.com/invite/jE6deAhjCM
-->
